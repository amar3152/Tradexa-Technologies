<h2>Posts</h2>

<!-- Error Message -->
<p *ngIf="errorMessage" style="color:red">
  {{ errorMessage }}
</p>

<!-- Add Button -->
<button (click)="toggleForm()">Add Post</button>

<!-- Form -->
<div *ngIf="showForm">
  <form #postForm="ngForm" (ngSubmit)="submitPost()" novalidate>

    <!-- Title -->
    <input
      type="text"
      placeholder="Title"
      name="title"
      required
      [(ngModel)]="newPost.title"
      #title="ngModel"
    />

    <div *ngIf="title.invalid && title.touched" style="color:red">
      Title is required
    </div>

    <br /><br />

    <!-- Body -->
    <textarea
      placeholder="Body"
      name="body"
      required
      [(ngModel)]="newPost.body"
      #body="ngModel">
    </textarea>

    <div *ngIf="body.invalid && body.touched" style="color:red">
      Body is required
    </div>

    <br /><br />

    <button type="submit" [disabled]="postForm.invalid">
      Submit
    </button>

  </form>
</div>

<!-- Table -->
<table border="1" cellpadding="8" cellspacing="0">
  <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Body</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let post of posts">
      <td>{{ post.id }}</td>
      <td>{{ post.title }}</td>
      <td>{{ post.body }}</td>
    </tr>
  </tbody>
</table>
